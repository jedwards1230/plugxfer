name: CI

run-name: "CI ${{ github.event.pull_request.title || github.ref_name }}"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.25.12"

      - name: Verify module files
        run: |
          go mod verify
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - name: Check formatting
        run: make fmt-check

      - name: Vet
        run: make vet

      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out -covermode=atomic ./...

      - name: Summarize coverage
        run: |
          coverage=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}')
          echo "## Test coverage: ${coverage}" >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: go build -trimpath -o plugxfer ./cmd/plugxfer

      - name: Smoke test binary
        run: |
          ./plugxfer --version
          ./plugxfer --help

  vulnerability-scan:
    name: Vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.25.12"

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.6.0

      - name: Scan reachable code
        run: govulncheck ./...

  ci:
    name: CI
    if: always()
    needs: [test, vulnerability-scan]
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          TEST_RESULT: ${{ needs.test.result }}
          VULN_RESULT: ${{ needs.vulnerability-scan.result }}
        run: |
          test "$TEST_RESULT" = success
          test "$VULN_RESULT" = success
