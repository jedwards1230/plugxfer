name: Reference plugins

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 9 * * 2"
  workflow_dispatch:

concurrency:
  group: reference-plugins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  anthropic:
    name: Anthropic fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugxfer
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Check out pinned Claude Code reference plugins
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
        with:
          repository: anthropics/claude-code
          ref: 1fb278b85d4546c7c04db3b3590e031b5a8a757
          path: reference/claude-code
          sparse-checkout: plugins

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16  # v6.5.0
        with:
          go-version: "1.25.12"

      - name: Build plugxfer
        run: go build -trimpath -o plugxfer ./cmd/plugxfer

      - name: Check and convert reference plugins
        run: scripts/test-reference-plugins.sh reference/claude-code/plugins
