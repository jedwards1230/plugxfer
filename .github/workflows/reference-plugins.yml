name: Reference plugins

on:
  # No branch filter: run on PRs to any base so stacked PRs are gated too.
  pull_request:
  schedule:
    - cron: "41 9 * * 2"
  workflow_dispatch:

concurrency:
  group: reference-plugins-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  anthropic:
    name: Anthropic fixtures
    runs-on: ubuntu-latest
    steps:
      - name: Check out plugxfer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Check out pinned Claude Code reference plugins
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          repository: anthropics/claude-code
          ref: 1fb278b85d4546c7c04db3b3590e031b5a8a7571
          path: reference/claude-code
          sparse-checkout: plugins

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build plugxfer
        run: go build -trimpath -o plugxfer ./cmd/plugxfer

      - name: Check and convert reference plugins
        run: scripts/test-reference-plugins.sh reference/claude-code/plugins
